<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCORM 1.2 - Demo NexiForma</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        margin: 0;
        padding: 1.25rem;
        background: #0f172a;
        color: #e2e8f0;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.5rem;
      }
      .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: #134e4a;
        color: #5eead4;
        padding: 0.2rem 0.55rem;
        border-radius: 999px;
        margin-bottom: 1rem;
      }
      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 1rem 1.1rem;
        margin: 1rem 0;
      }
      label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      textarea {
        width: 100%;
        min-height: 72px;
        border-radius: 8px;
        border: 1px solid #475569;
        background: #0f172a;
        color: #f1f5f9;
        padding: 0.6rem 0.75rem;
        font: inherit;
        box-sizing: border-box;
      }
      .opts {
        display: grid;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .opt {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        padding: 0.55rem 0.65rem;
        border-radius: 8px;
        border: 1px solid #334155;
        cursor: pointer;
      }
      .opt:has(input:checked) {
        border-color: #2563eb;
        background: rgba(37, 99, 235, 0.12);
      }
      .opt input {
        margin-top: 0.2rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 0.55rem 1rem;
        font-weight: 600;
        font-size: 0.875rem;
        cursor: pointer;
      }
      .primary {
        background: #2563eb;
        color: #fff;
      }
      .primary:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .ghost {
        background: transparent;
        color: #94a3b8;
        border: 1px solid #475569;
      }
      .status {
        font-size: 0.8rem;
        color: #94a3b8;
        margin-top: 0.75rem;
      }
      .ok {
        color: #2dd4bf;
      }
      .warn {
        color: #fbbf24;
      }
    </style>
  </head>
  <body>
    <span class="badge">SCORM 1.2 · SCO</span>
    <h1>Formação demo NexiForma</h1>
    <p>Pacote de referência com API <code>LMSSetValue</code> / <code>LMSCommit</code>. Nota mínima: 80%.</p>

    <div class="card">
      <label for="q1">1. O que significa SCORM?</label>
      <div class="opts" id="q1">
        <label class="opt"><input type="radio" name="q1" value="a" /> Sharable Content Object Reference Model</label>
        <label class="opt"><input type="radio" name="q1" value="b" /> Sistema Comercial de Recursos Moodle</label>
        <label class="opt"><input type="radio" name="q1" value="c" /> Standard Course Online Resource Manager</label>
      </div>
    </div>

    <div class="card">
      <label for="reflexao">2. Em uma frase, o que aprendeste?</label>
      <textarea id="reflexao" placeholder="Escreve a tua reflexão…"></textarea>
    </div>

    <div class="actions">
      <button type="button" class="primary" id="btn-submit" disabled>Submeter e concluir</button>
      <button type="button" class="ghost" id="btn-save">Guardar progresso</button>
    </div>

    <p class="status" id="status">A ligar ao LMS…</p>

    <script>
      (function () {
        var MASTERY = 80;
        var startTime = Date.now();

        function findAPI(win) {
          var depth = 0;
          while (win && depth < 12) {
            if (win.API) return win.API;
            if (win.parent === win) break;
            win = win.parent;
            depth++;
          }
          return null;
        }

        var API = findAPI(window);
        var statusEl = document.getElementById("status");
        var btnSubmit = document.getElementById("btn-submit");
        var btnSave = document.getElementById("btn-save");
        var reflexao = document.getElementById("reflexao");

        function setStatus(text, cls) {
          statusEl.textContent = text;
          statusEl.className = "status" + (cls ? " " + cls : "");
        }

        function sessionTime() {
          var sec = Math.floor((Date.now() - startTime) / 1000);
          var h = Math.floor(sec / 3600);
          var m = Math.floor((sec % 3600) / 60);
          var s = sec % 60;
          return (
            String(h).padStart(4, "0") +
            ":" +
            String(m).padStart(2, "0") +
            ":" +
            String(s).padStart(2, "0")
          );
        }

        function score() {
          var q1 = document.querySelector('input[name="q1"]:checked');
          var pts = 0;
          if (q1 && q1.value === "a") pts += 50;
          if (reflexao.value.trim().length >= 8) pts += 50;
          return pts;
        }

        function canSubmit() {
          return document.querySelector('input[name="q1"]:checked') && reflexao.value.trim().length >= 8;
        }

        function syncDirty() {
          btnSubmit.disabled = !canSubmit();
        }

        function writeCmi(completed) {
          if (!API) return false;
          var raw = score();
          API.LMSSetValue("cmi.core.score.min", "0");
          API.LMSSetValue("cmi.core.score.max", "100");
          API.LMSSetValue("cmi.core.score.raw", String(raw));
          API.LMSSetValue("cmi.core.session_time", sessionTime());
          API.LMSSetValue(
            "cmi.suspend_data",
            JSON.stringify({ q1: document.querySelector('input[name="q1"]:checked')?.value || "", r: reflexao.value }),
          );
          if (completed) {
            API.LMSSetValue("cmi.core.lesson_status", raw >= MASTERY ? "passed" : "failed");
          } else {
            var prev = (API.LMSGetValue("cmi.core.lesson_status") || "").toLowerCase();
            if (!prev || prev === "not attempted") {
              API.LMSSetValue("cmi.core.lesson_status", "incomplete");
            }
          }
          API.LMSCommit("");
          return true;
        }

        if (!API) {
          setStatus("API SCORM 1.2 (window.API) não encontrada. Abre via player NexiForma.", "warn");
          btnSave.disabled = true;
          document.querySelectorAll("input, textarea, button").forEach(function (el) {
            if (el.id !== "btn-save") return;
          });
          return;
        }

        var init = API.LMSInitialize("");
        if (init !== "true" && init !== true) {
          setStatus("LMSInitialize falhou.", "warn");
          return;
        }

        try {
          var saved = API.LMSGetValue("cmi.suspend_data");
          if (saved) {
            var data = JSON.parse(saved);
            if (data.q1) {
              var radio = document.querySelector('input[name="q1"][value="' + data.q1 + '"]');
              if (radio) radio.checked = true;
            }
            if (data.r) reflexao.value = data.r;
          }
        } catch (e) {
          /* ignore */
        }

        var lesson = (API.LMSGetValue("cmi.core.lesson_status") || "not attempted").toLowerCase();
        setStatus("LMS ligado · estado: " + lesson + " · SCORM 1.2", "ok");
        syncDirty();

        document.getElementById("q1").addEventListener("change", syncDirty);
        reflexao.addEventListener("input", syncDirty);

        btnSave.addEventListener("click", function () {
          if (writeCmi(false)) setStatus("Progresso guardado (" + score() + "%).", "ok");
        });

        btnSubmit.addEventListener("click", function () {
          if (!canSubmit()) return;
          if (writeCmi(true)) {
            var raw = score();
            setStatus(
              raw >= MASTERY
                ? "Concluído com sucesso (" + raw + "% ≥ " + MASTERY + "%)."
                : "Submetido (" + raw + "%). Nota mínima: " + MASTERY + "%.",
              raw >= MASTERY ? "ok" : "warn",
            );
            btnSubmit.disabled = true;
          }
        });

        window.addEventListener("beforeunload", function () {
          writeCmi(false);
          API.LMSFinish("");
        });
      })();
    </script>
  </body>
</html>
