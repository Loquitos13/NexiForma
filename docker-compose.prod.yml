services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexiforma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexiforma_prod}
      POSTGRES_DB: nexiforma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexiforma"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://nexiforma:${POSTGRES_PASSWORD:-nexiforma_prod}@postgres:5432/nexiforma?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: 4000
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RLS_ENABLED: ${RLS_ENABLED:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MFA_REQUIRED_MANAGERS: ${MFA_REQUIRED_MANAGERS:-true}
      NEXIGUIA_LLM_URL: ${NEXIGUIA_LLM_URL:-http://ollama:11434}
      NEXIGUIA_LLM_ENABLED: ${NEXIGUIA_LLM_ENABLED:-true}
      NEXIGUIA_LLM_MODEL: ${NEXIGUIA_LLM_MODEL:-qwen2.5:1.5b-instruct}
      NEXIGUIA_LLM_TIMEOUT_MS: ${NEXIGUIA_LLM_TIMEOUT_MS:-120000}
    depends_on:
      - redis
    volumes:
      - api_storage:/app/storage
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/v1').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  api-docs:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/docs-server.main.js"]
    environment:
      API_DOCS_PORT: 4001
      API_PORT: 4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.nexiforma.pt}
      API_DOCS_PUBLIC_URL: ${API_DOCS_PUBLIC_URL:-https://api.nexiforma.pt}
      NODE_ENV: production
    ports:
      - "4001:4001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Perfil opcional: docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=-1
    deploy:
      resources:
        limits:
          memory: 1.8G
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

volumes:
  pgdata:
  redisdata:
  api_storage:
  ollama_data:
