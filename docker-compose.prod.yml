services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexiforma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexiforma_prod}
      POSTGRES_DB: nexiforma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexiforma"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      # Overrides de rede Docker (ganham sobre o .env)
      DATABASE_URL: postgresql://nexiforma:${POSTGRES_PASSWORD:-nexiforma_prod}@postgres:5432/nexiforma?schema=public
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      API_PORT: 4000
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      RLS_ENABLED: ${RLS_ENABLED:-true}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      MFA_REQUIRED_MANAGERS: ${MFA_REQUIRED_MANAGERS:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_storage:/app/storage
    ports:
      - "4000:4000"

  api-docs:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "apps/api/dist/docs-server.main.js"]
    environment:
      API_DOCS_PORT: 4001
      API_PORT: 4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.nexiforma.pt}
      API_DOCS_PUBLIC_URL: ${API_DOCS_PUBLIC_URL:-https://api.nexiforma.pt}
      NODE_ENV: production
    ports:
      - "4001:4001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    environment:
      API_URL: http://api:4000
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "3000:3000"

  # Perfil opcional: docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

volumes:
  pgdata:
  redisdata:
  api_storage:
  ollama_data:
